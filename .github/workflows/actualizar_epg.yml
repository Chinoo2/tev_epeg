name: Actualizar Todo En Vivo EPG

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install requests

      - name: Ejecutar generador EPG
        run: |
          python generar_tev_epg.py

      - name: Guardar EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tev_epg.xml
          git diff --cached --quiet || git commit -m "Actualizar Todo En Vivo EPG"
          git push
